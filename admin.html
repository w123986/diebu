<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>教师留言管理 · 迭部乡土地理教学</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:"Microsoft YaHei","PingFang SC",sans-serif;background:#f4f6f4;color:#1f2d1f;line-height:1.6}
header{background:#2c5f2d;color:#fff;text-align:center;padding:26px 16px}header h1{font-size:23px;margin:0}header p{margin:6px 0 0;font-size:14px;opacity:.88}header a{color:#fff}
main{max-width:900px;margin:30px auto;padding:0 18px}.panel{background:#fff;border-radius:10px;padding:22px;margin-bottom:20px;box-shadow:0 2px 10px rgba(0,0,0,.07)}
h2{font-size:20px;color:#2c5f2d;margin:0 0 14px}label{display:block;font-size:14px;color:#2c5f2d;margin:12px 0 5px}
input,textarea{width:100%;padding:11px 12px;border:1px solid #ccd8cc;border-radius:6px;font:inherit;background:#fafcfa}textarea{min-height:90px;resize:vertical}
button{border:0;border-radius:6px;background:#2c5f2d;color:#fff;padding:10px 18px;font:inherit;cursor:pointer}button:disabled{opacity:.6;cursor:wait}
.secondary{background:#647564}.danger{background:#a33b32}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:10px}
.status{font-size:14px;color:#657565;margin:8px 0}.msg{border:1px solid #e2ebe2;border-left:4px solid #8fc98f;border-radius:8px;padding:16px;margin:14px 0}
.meta{font-size:13px;color:#687768;margin-bottom:8px}.content{white-space:pre-wrap;word-break:break-word}.hidden{display:none!important}
</style>
</head>
<body>
<header><h1>教师留言管理</h1><p>多尺度乡土地理教学 · 迭部</p><p><a href="message.html">返回互动留言页面</a></p></header>
<main>
<section class="panel" id="loginPanel">
<h2>教师登录</h2><p class="status">请使用已在 Supabase Authentication 中创建并获授权的教师账号登录。</p>
<form id="loginForm"><label for="email">教师邮箱</label><input id="email" type="email" autocomplete="username" required>
<label for="password">密码</label><input id="password" type="password" autocomplete="current-password" required>
<div class="actions"><button id="loginButton" type="submit">登录</button></div></form><p class="status" id="loginStatus" role="status"></p>
</section>
<section class="panel hidden" id="dashboard">
<div class="actions" style="justify-content:space-between;align-items:center"><h2 style="margin:0">学生留言</h2><button class="secondary" id="logoutButton">退出登录</button></div>
<p class="status" id="dashboardStatus">正在读取留言…</p><div id="adminMessages"></div>
</section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
const db=window.supabase.createClient("https://naqyeawdjmgalvkbgivy.supabase.co","sb_publishable_zS4wxEUR3-bbEWPMZlOxQ_3MCfQPWI");
const loginPanel=document.getElementById("loginPanel"),dashboard=document.getElementById("dashboard"),loginForm=document.getElementById("loginForm");
const loginStatus=document.getElementById("loginStatus"),dashboardStatus=document.getElementById("dashboardStatus"),messagesBox=document.getElementById("adminMessages"),loginButton=document.getElementById("loginButton");
function el(tag,cls,txt){const n=document.createElement(tag);if(cls)n.className=cls;if(txt!==undefined)n.textContent=txt;return n;}
function time(v){return v?new Date(v).toLocaleString("zh-CN",{hour12:false}):"";}
async function verifyTeacher(){
const {data:{user}}=await db.auth.getUser();
if(!user){loginPanel.classList.remove("hidden");dashboard.classList.add("hidden");return false;}
const {data,error}=await db.from("teacher_admins").select("user_id").eq("user_id",user.id).maybeSingle();
if(error||!data){await db.auth.signOut();loginStatus.textContent="该账号尚未获得教师管理权限，请联系网站管理员。";loginPanel.classList.remove("hidden");dashboard.classList.add("hidden");return false;}
loginPanel.classList.add("hidden");dashboard.classList.remove("hidden");return true;
}
async function load(){
dashboardStatus.textContent="正在读取留言…";messagesBox.replaceChildren();
const {data,error}=await db.from("diebu_messages").select("id,nickname,identity,content,teacher_reply,created_at").order("created_at",{ascending:false}).limit(200);
if(error){dashboardStatus.textContent="读取失败："+error.message;return;}
dashboardStatus.textContent="共 "+data.length+" 条留言";
if(!data.length){messagesBox.append(el("p","status","目前还没有留言。"));return;}
data.forEach(row=>{
const card=el("article","msg"),meta=el("div","meta",(row.nickname||"匿名")+" · "+(row.identity||"未注明身份")+" · "+time(row.created_at));
const content=el("div","content",row.content||""),label=el("label","","教师回复"),area=el("textarea");area.value=row.teacher_reply||"";
const actions=el("div","actions"),save=el("button","","保存回复"),del=el("button","danger","删除留言");
save.addEventListener("click",async()=>{save.disabled=true;const {error}=await db.from("diebu_messages").update({teacher_reply:area.value.trim()||null}).eq("id",row.id);save.disabled=false;if(error){alert("保存失败："+error.message);return;}await load();});
del.addEventListener("click",async()=>{if(!confirm("确定删除这条留言吗？此操作不可撤销。"))return;del.disabled=true;const {error}=await db.from("diebu_messages").delete().eq("id",row.id);del.disabled=false;if(error){alert("删除失败："+error.message);return;}await load();});
actions.append(save,del);card.append(meta,content,label,area,actions);messagesBox.append(card);
});
}
loginForm.addEventListener("submit",async ev=>{ev.preventDefault();loginButton.disabled=true;loginStatus.textContent="正在验证账号…";
const {error}=await db.auth.signInWithPassword({email:document.getElementById("email").value.trim(),password:document.getElementById("password").value});loginButton.disabled=false;
if(error){loginStatus.textContent="登录失败："+error.message;return;}if(await verifyTeacher())await load();
});
document.getElementById("logoutButton").addEventListener("click",async()=>{await db.auth.signOut();loginPanel.classList.remove("hidden");dashboard.classList.add("hidden");});
verifyTeacher().then(ok=>{if(ok)load();});
})();
</script>
</body></html>
